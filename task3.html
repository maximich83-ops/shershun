<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма реєстрації</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background: #f2f2f2;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .form-container{
            background: white;
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        h1{
            text-align: center;
            margin-bottom: 30px;
        }

        .form-block{
            margin-bottom: 30px;
        }

        .form-block h2{
            margin-bottom: 20px;
            color: #333;
        }

        .form-row{
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-group{
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        label{
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select{
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .radio-group,
        .checkbox-group{
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        button{
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2b7cff;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover{
            background: #1f5fd1;
        }

        /* ======================
           АДАПТИВНІСТЬ
        ====================== */

        @media(max-width: 700px){

            .form-row{
                flex-direction: column;
            }

            body{
                padding: 15px;
            }

            .form-container{
                padding: 20px;
            }
        }

    </style>
</head>
<body>

    <form class="form-container">

        <h1>Форма реєстрації</h1>

        <!-- Реєстраційні дані -->
        <div class="form-block">

            <h2>Реєстраційні дані</h2>

            <div class="form-row">

                <div class="input-group">
                    <label>Логін</label>
                    <input type="text" placeholder="Введіть логін">
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="example@gmail.com">
                </div>

            </div>

            <div class="form-row">

                <div class="input-group">
                    <label>Пароль</label>
                    <input type="password" placeholder="Введіть пароль">
                </div>

            </div>

        </div>


        <!-- Персональні дані -->
        <div class="form-block">

            <h2>Персональні дані</h2>

            <div class="form-row">

                <div class="input-group">
                    <label>Ім'я</label>
                    <input type="text" placeholder="Ім'я">
                </div>

                <div class="input-group">
                    <label>Прізвище</label>
                    <input type="text" placeholder="Прізвище">
                </div>

            </div>

            <div class="form-row">

                <div class="input-group">
                    <label>Дата народження</label>
                    <input type="date">
                </div>

            </div>

            <div class="radio-group">

                <label>Стать:</label>

                <input type="radio" name="gender">
                <span>Чоловіча</span>

                <input type="radio" name="gender">
                <span>Жіноча</span>

            </div>

        </div>


        <!-- Додаткові налаштування -->
        <div class="form-block">

            <h2>Налаштування</h2>

            <div class="checkbox-group">
                <input type="checkbox">
                <span>Підписатися на розсилку</span>
            </div>

            <div class="checkbox-group">
                <input type="checkbox">
                <span>Погоджуюсь з правилами ресурсу</span>
            </div>

        </div>

        <button type="submit">Зареєструватися</button>

    </form>

</body>
</html>

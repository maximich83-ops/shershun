<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Новини</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 рівні колонки */
            gap: 20px;
            padding: 20px;
        }

        .column {
            background-color: #f2f2f2;
            padding: 15px;
            border-radius: 8px;
        }

        .column h2 {
            margin-top: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="column">
        <h2>Новина 1</h2>
        <p>Текст новини...</p>
    </div>

    <div class="column">
        <h2>Новина 2</h2>
        <p>Текст новини...</p>
    </div>

    <div class="column">
        <h2>Новина 3</h2>
        <p>Текст новини...</p>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Чат</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            margin: 0;
            padding: 20px;
        }

        .chat {
            max-width: 600px;
            margin: 0 auto;
        }

        .message {
            display: flex;
            margin-bottom: 15px;
            align-items: flex-end;
        }

        
        .left {
            flex-direction: row;
        }

        
        .right {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #ccc;
            margin: 0 10px;
        }

        .content {
            max-width: 70%;
        }

        .name-time {
            font-size: 12px;
            margin-bottom: 5px;
        }

        .left .name-time {
            text-align: left;
        }

        .right .name-time {
            text-align: right;
        }

        .text {
            padding: 10px;
            border-radius: 10px;
        }

        
        .left .text {
            background: #ffffff;
        }

        .right .text {
            background: #d1e7ff;
        }
    </style>
</head>
<body>

<div class="chat">

    
    <div class="message left">
        <div class="avatar"></div>
        <div class="content">
            <div class="name-time">Іван • 12:30</div>
            <div class="text">Привіт! Як справи?</div>
        </div>
    </div>

    
    <div class="message right">
        <div class="avatar"></div>
        <div class="content">
            <div class="name-time">Ти • 12:31</div>
            <div class="text">Все добре! А в тебе?</div>
        </div>
    </div>

    <div class="message left">
        <div class="avatar"></div>
        <div class="content">
            <div class="name-time">Іван • 12:32</div>
            <div class="text">Теж нормально 👍</div>
        </div>
    </div>

</div>

</body>
</html>
